    "dep:clap",
    "lzma-sys/static",
]
default = [
    "aws",
    "azure",
    "gcp",
    "oss",
    "huggingface",
]
dynamodb = [
    "lance-table/dynamodb",
    "dep:aws-sdk-dynamodb",
]
dynamodb_tests = ["dynamodb"]
fp16kernels = ["lance-linalg/fp16kernels"]
gcp = ["lance-io/gcp"]
huggingface = ["lance-io/huggingface"]
