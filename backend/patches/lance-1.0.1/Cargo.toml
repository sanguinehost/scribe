[package]
edition = "2021"
rust-version = "1.82.0"
name = "lance"
version = "1.0.1"
authors = ["Lance Devs <dev@lance.org>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A columnar data format that is 100x faster than Parquet for random access."
readme = "README.md"
keywords = [
    "data-format",
    "data-science",
    "machine-learning",
    "apache-arrow",
    "data-analytics",
]
categories = [
    "database-implementations",
    "data-structures",
    "development-tools",
    "science",
]
license = "Apache-2.0"
repository = "https://github.com/lance-format/lance"

[package.metadata.docs.rs]
features = []
no-default-features = true

[features]
aws = [
    "lance-io/aws",
    "dep:aws-credential-types",
]
