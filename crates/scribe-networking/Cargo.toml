[package]
name = "scribe-networking"
version = "0.1.0"
edition = "2021"

[dependencies]
scribe-core = { path = "../scribe-core" }
libp2p = { version = "0.53", features = ["tcp", "dns", "websocket", "noise", "yamux", "gossipsub", "kad", "identify", "macros", "tokio", "mdns"] }
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
asynchronous-codec = "0.7"
bytes = "1.0"
unsigned-varint = { version = "0.8", features = ["codec"] }
pin-project = "1.1"

[dev-dependencies]
proptest = "1.6"
tokio-test = "0.4"
