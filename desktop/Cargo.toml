[package]
name = "scribe-desktop"
version = "0.1.0"
description = "Scribe Desktop - A standalone desktop application for character-based AI conversations"
authors = ["Sanguine Software"]
license = "MIT"
repository = "https://github.com/sanguinehost/scribe"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "scribe_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.8.5", features = [] }
tauri-plugin-log = "2"

# Async runtime for embedded backend
tokio = { version = "1", features = ["full"] }

# Server dependencies
axum-server = { version = "0.6", features = ["tls-rustls"] }
anyhow = "1"
tracing = "0.1"

# Workspace dependencies
scribe-backend = { path = "../backend", default-features = false, features = ["desktop"] }
