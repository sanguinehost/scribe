[package]
name = "scribe-crypto"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
argon2 = { version = "0.5", features = ["std"] }
base64 = "0.22"
hmac = "0.12"
rand = "0.8"
ring = "0.17"
secrecy = { version = "0.10", features = ["serde"] }
sha2 = "0.10"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
hex = "0.4"
