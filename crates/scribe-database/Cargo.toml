[package]
name = "scribe-database"
version = "0.1.0"
edition = "2021"

[features]
default = []
postgres-backend = [
    "diesel/postgres",
    "dep:deadpool-diesel",
    "deadpool-diesel?/postgres",
    "diesel_migrations/postgres",
    "diesel-derive-enum/postgres",
    "dep:diesel_json",
]
sqlite-backend = [
    "diesel/sqlite",
    "diesel/r2d2",
    "diesel_migrations/sqlite",
    "diesel-derive-enum/sqlite",
]
desktop = ["sqlite-backend", "dep:libsql"]
cloud = ["postgres-backend"]

[dependencies]
scribe-core = { path = "../scribe-core" }
diesel = { version = "2.3", default-features = false, features = [
    "chrono",
    "uuid",
    "serde_json",
    "numeric",
    "64-column-tables",
    "128-column-tables",
    "with-deprecated",
] }
diesel_migrations = { version = "2.3", default-features = false }
diesel-derive-enum = { version = "2.1.0", default-features = false }
deadpool = { version = "0.12.2", default-features = false }
deadpool-diesel = { version = "0.6.1", default-features = false, features = [
    "rt_tokio_1",
    "serde",
], optional = true }
diesel_json = { version = "0.3.0", optional = true }

uuid = { version = "1.15", features = ["v4", "serde"] }
chrono = { version = "0.4.40", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bigdecimal = { version = "0.4.8", features = ["serde"] }
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1.44", features = ["full"] }
libsql = { version = "0.6.0", optional = true }
async-trait = "0.1"
futures-util = "0.3"

[dev-dependencies]
testcontainers = "0.27.0"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread"] }
tempfile = "3.19.1"
