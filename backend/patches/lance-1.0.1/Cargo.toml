protoc = [
    "lance-encoding/protoc",
    "lance-file/protoc",
    "lance-index/protoc",
    "lance-table/protoc",
]
substrait = ["lance-datafusion/substrait"]

[lib]
name = "lance"
path = "src/lib.rs"

[[bin]]
