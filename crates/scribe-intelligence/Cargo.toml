[package]
name = "scribe-intelligence"
version = "0.1.0"
edition = "2021"

[dependencies]
scribe-core = { path = "../scribe-core" }
rig-core = { version = "0.36.0", features = ["derive"] }
rig-lancedb = { version = "0.4.5", optional = true }
rig-qdrant = { version = "0.2.5", optional = true }
qdrant-client = { version = "1.14.0", features = ["serde"] }
lancedb = { version = "0.23.1", optional = true }
arrow = { version = "56.2.0", optional = true }
async-trait = "0.1.88"
anyhow = "1.0.98"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.2", features = ["full"] }
tracing = "0.1.41"
futures = "0.3.31"
async-stream = "0.3.6"
thiserror = "2.0.12"
uuid = { version = "1.15", features = ["v4", "serde"] }
chrono = { version = "0.4.40", features = ["serde"] }
blake3 = "1.5.1"
tokenizers = { version = "0.22.2" }

# MCP dependencies
mcp-core = { version = "0.1.0", optional = true } # Assuming this exists or using direct tool traits

[features]
default = ["cloud"]
desktop = ["sqlite-vector"]
cloud = ["remote-vector"]
remote-vector = ["dep:rig-qdrant"]
sqlite-vector = ["dep:rig-lancedb", "dep:lancedb", "dep:arrow"]
mcp = ["dep:mcp-core"]
