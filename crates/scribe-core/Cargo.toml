[package]
name = "scribe-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
uuid = { version = "0.8.2", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
bytemuck = { version = "1.25.0", features = ["derive"] }

[dev-dependencies]
proptest = "1.6"

