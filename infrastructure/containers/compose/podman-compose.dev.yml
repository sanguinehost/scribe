# This file is kept for backward compatibility
#
# For local development (backend with cargo): use podman-compose.local.yml
# For container development (all containerized): use podman-compose.container.yml

version: '3.8'

services:
  postgres:
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: sanguine_scribe_dev
    ports:
      - "5432:5432"
    volumes:
      - ../configs/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro,Z

  qdrant:
    ports:
      - "6333:6333"
      - "6334:6334"
